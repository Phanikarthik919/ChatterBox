# Render Blueprint -- Infrastructure as Code
# Deploy via: https://render.com/deploy

services:
  - type: web
    name: chatterbox
    runtime: docker
    repo: https://github.com/Phanikarthik919/ChatterBox
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      - key: DB_HOST
        fromDatabase:
          name: chatterbox-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: chatterbox-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: chatterbox-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: chatterbox-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: chatterbox-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false   # you must paste this manually in the Render dashboard

databases:
  - name: chatterbox-db
    plan: free
    databaseName: chatterbox
    user: chatterbox
