<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ChatterBox - A beautiful real-time chat application with group chats, direct messages, and file sharing.">
    <title>ChatterBox — Real-Time Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>

    <!-- ====== AUTH SCREENS ====== -->
    <div id="auth-container" class="auth-container" style="display:flex;">
        <div class="auth-bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
        </div>

        <div class="auth-card" id="auth-card">
            <div class="auth-logo">
                <span class="logo-icon">💬</span>
                <h1>ChatterBox</h1>
                <p class="tagline">Connect. Chat. Collaborate.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="login-username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span>Sign In</span>
                    <div class="btn-loader" style="display:none;"></div>
                </button>
                <p class="auth-switch">Don't have an account? <a href="#" id="show-register">Sign Up</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="register-username" placeholder="Choose a username" required minlength="3" maxlength="30">
                    </div>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="register-email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="register-display-name">Display Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="register-display-name" placeholder="Your display name (optional)" maxlength="50">
                    </div>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="register-password" placeholder="Min. 6 characters" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="register-btn">
                    <span>Create Account</span>
                    <div class="btn-loader" style="display:none;"></div>
                </button>
                <p class="auth-switch">Already have an account? <a href="#" id="show-login">Sign In</a></p>
            </form>

            <div id="auth-error" class="auth-error" style="display:none;"></div>
        </div>
    </div>

    <!-- ====== MAIN CHAT APP ====== -->
    <div id="chat-container" class="chat-container" style="display:none;">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span class="logo-icon-sm">💬</span>
                    <span class="logo-text">ChatterBox</span>
                </div>
                <button class="btn-icon" id="new-chat-btn" title="New Chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>

            <div class="sidebar-search">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-rooms" placeholder="Search conversations..." autocomplete="off">
                </div>
            </div>

            <div class="room-list" id="room-list">
                <!-- Chat rooms render here -->
            </div>

            <div class="sidebar-footer">
                <div class="user-profile-mini" id="user-profile-mini">
                    <div class="avatar avatar-sm" id="sidebar-avatar">
                        <span class="avatar-text"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="user-info-mini">
                        <span class="username" id="sidebar-username"></span>
                        <span class="user-status">Online</span>
                    </div>
                </div>
                <button class="btn-icon" id="logout-btn" title="Logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area" id="chat-area">

            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">💬</div>
                <h2>Welcome to ChatterBox!</h2>
                <p>Select a conversation or start a new chat to begin messaging.</p>
                <button class="btn btn-primary" id="empty-new-chat-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>Start a Conversation</span>
                </button>
            </div>

            <!-- Active Chat -->
            <div class="active-chat" id="active-chat" style="display:none;">

                <!-- Chat Header -->
                <div class="chat-header" id="chat-header">
                    <button class="btn-icon mobile-back-btn" id="mobile-back-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <div class="chat-header-info">
                        <div class="avatar avatar-md" id="chat-avatar">
                            <span class="avatar-text"></span>
                            <span class="status-dot" id="chat-status-dot"></span>
                        </div>
                        <div class="chat-header-text">
                            <h2 id="chat-room-name"></h2>
                            <span class="chat-subtitle" id="chat-subtitle"></span>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="btn-icon" id="chat-search-btn" title="Search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </button>
                        <button class="btn-icon" id="chat-info-btn" title="Info">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Messages Area -->
                <div class="messages-area" id="messages-area">
                    <div class="messages-list" id="messages-list">
                        <!-- Messages render here -->
                    </div>
                    <div class="typing-indicator" id="typing-indicator" style="display:none;">
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                        <span class="typing-text" id="typing-text"></span>
                    </div>
                </div>

                <!-- Message Input -->
                <div class="message-input-area" id="message-input-area">
                    <div class="input-toolbar">
                        <button class="btn-icon" id="emoji-btn" title="Emoji">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                        </button>
                        <button class="btn-icon" id="attach-btn" title="Attach file">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf,.doc,.docx,.txt,.zip">
                    </div>
                    <div class="message-input-wrapper">
                        <textarea id="message-input" placeholder="Type a message..." rows="1" maxlength="5000"></textarea>
                    </div>
                    <button class="btn-send" id="send-btn" title="Send" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ====== NEW CHAT MODAL ====== -->
    <div class="modal-overlay" id="new-chat-modal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>New Conversation</h2>
                <button class="btn-icon modal-close" id="modal-close-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="direct">Direct Message</button>
                <button class="tab-btn" data-tab="group">Group Chat</button>
            </div>
            <div class="modal-body">
                <!-- Direct Message Tab -->
                <div class="tab-content active" id="tab-direct">
                    <div class="search-wrapper modal-search">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="user-search-input" placeholder="Search users..." autocomplete="off">
                    </div>
                    <div class="user-search-results" id="user-search-results">
                        <p class="search-hint">Type to search for users</p>
                    </div>
                </div>
                <!-- Group Chat Tab -->
                <div class="tab-content" id="tab-group">
                    <div class="form-group">
                        <label>Group Name</label>
                        <input type="text" id="group-name-input" placeholder="Enter group name" class="modal-input">
                    </div>
                    <div class="form-group">
                        <label>Description (optional)</label>
                        <input type="text" id="group-desc-input" placeholder="What's this group about?" class="modal-input">
                    </div>
                    <div class="search-wrapper modal-search">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="group-user-search" placeholder="Add participants..." autocomplete="off">
                    </div>
                    <div class="selected-users" id="selected-users"></div>
                    <div class="user-search-results" id="group-search-results">
                        <p class="search-hint">Search and add participants</p>
                    </div>
                    <button class="btn btn-primary" id="create-group-btn" style="margin-top: 16px;" disabled>Create Group</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== EMOJI PICKER ====== -->
    <div class="emoji-picker" id="emoji-picker" style="display:none;">
        <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <!-- ====== TOAST NOTIFICATIONS ====== -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
