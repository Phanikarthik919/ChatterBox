server:
  port: 8080

spring:
  application:
    name: ChatterBox

  datasource:
    url: jdbc:h2:file:./data/chatterbox
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: chatterbox-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-2024
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  file:
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,txt,zip,mp4,mp3

  cors:
    allowed-origins: http://localhost:8080,http://localhost:3000

cloudinary:
  # Set CLOUDINARY_URL=cloudinary://api_key:api_secret@cloud_name
  # or fill individual fields below
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
