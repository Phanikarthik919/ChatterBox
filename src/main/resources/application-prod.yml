# --- Production Profile ---
server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatterbox}
    username: ${SPRING_DATASOURCE_USERNAME:chatterbox}
    password: ${SPRING_DATASOURCE_PASSWORD:chatterbox}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:chatterbox-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-2024}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR:./uploads}
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,txt,zip,mp4,mp3

  cors:
    allowed-origins: ${APP_CORS_ORIGINS:*}

logging:
  level:
    root: WARN
    com.chatterbox: INFO
