# --- Production Profile ---
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatterbox}
    username: ${SPRING_DATASOURCE_USERNAME:chatterbox}
    password: ${SPRING_DATASOURCE_PASSWORD:chatterbox}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:chatterbox-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-2024}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

  file:
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,txt,zip,mp4,mp3

  cors:
    allowed-origins: ${APP_CORS_ORIGINS:*}

cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    root: WARN
    com.chatterbox: INFO
